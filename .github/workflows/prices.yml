name: Update fuel prices and publish

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 minutes
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server location (for troubleshooting)
        run: curl -s https://ipinfo.io/json | grep -E '"(country|region|org)"' || true
      - name: Build site folder
        run: |
          mkdir -p dist
          cp -r index.html manifest.webmanifest sw.js icons vendor dist/
          touch dist/.nojekyll
      - name: Fetch live prices
        run: node scripts/refresh-prices.mjs dist
        env:
          FF_CLIENT_ID: ${{ secrets.FF_CLIENT_ID }}
          FF_CLIENT_SECRET: ${{ secrets.FF_CLIENT_SECRET }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
